name: auto-release

# On pushes to main, tags the next minor version and runs the release pipeline in
# ONE workflow. Same shape as autonoco/buttons: tag the merge SHA, then publish.
# Rapid pushes are serialized by the shared `release` concurrency group; the newest
# queued main commit is released after the active release finishes.
#
# Previous approach (bump package.json, commit, open a version-sync PR) is not how
# buttons works. The git tag is the version. Manifests are stamped in the release
# job workspace only — never committed back to main.
#
# Tag + publish stay in this workflow because GitHub blocks cross-workflow triggering
# from GITHUB_TOKEN: "Events triggered by GITHUB_TOKEN will not create a new workflow run."
#
# To skip a release: include [skip release] in the merge commit.
# Bot commits (docs-sync) are skipped automatically.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semver tag to recover (for example, v0.2.0)
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  tag:
    name: Tag and release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.actor != 'github-actions[bot]' &&
        !contains(github.event.head_commit.message, '[skip release]')
      )
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      checkout_ref: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Manual recovery must build the existing tag, not the branch used
          # to dispatch the workflow. Push-triggered releases use their SHA.
          ref: ${{ inputs.tag || github.sha }}
          persist-credentials: false

      - name: Determine next version
        id: version
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # One canonical SemVer policy (semver.org grammar) — byte-for-byte the SEMVER_SOURCE
          # the tools/release version stamper enforces; workflows.test.ts asserts they match.
          SEMVER='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?'
          if [ -n "$REQUESTED_TAG" ]; then
            if ! printf '%s' "$REQUESTED_TAG" | grep -Eq "^v${SEMVER}$"; then
              echo "Invalid recovery tag: $REQUESTED_TAG" >&2
              exit 1
            fi

            TAG_SHA=$(git rev-parse --verify "refs/tags/$REQUESTED_TAG^{commit}")
            HEAD_SHA=$(git rev-parse HEAD)
            if [ "$TAG_SHA" != "$HEAD_SHA" ]; then
              echo "Recovery checkout mismatch: $REQUESTED_TAG points to $TAG_SHA, checked out $HEAD_SHA" >&2
              exit 1
            fi

            echo "version=${REQUESTED_TAG#v}" >> "$GITHUB_OUTPUT"
            echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
            echo "create_tag=false" >> "$GITHUB_OUTPUT"
            echo "Recovering existing release: $REQUESTED_TAG"
            exit 0
          fi

          # Rerun guard: if a previous attempt already tagged this SHA (tag pushed, release job
          # failed), reuse that tag instead of computing the next minor from it — otherwise a
          # rerun mints a second version on the same commit and publishes both.
          EXISTING_TAG=$(
            git tag --points-at HEAD --list 'v*' --sort=-version:refname |
              grep -E "^v${SEMVER}$" |
              head -n1 || true
          )
          if [ -n "$EXISTING_TAG" ]; then
            echo "version=${EXISTING_TAG#v}" >> "$GITHUB_OUTPUT"
            echo "tag=$EXISTING_TAG" >> "$GITHUB_OUTPUT"
            echo "create_tag=false" >> "$GITHUB_OUTPUT"
            echo "Reusing existing release tag: $EXISTING_TAG"
            exit 0
          fi

          LATEST=$(
            git tag --list 'v*' --sort=-version:refname |
              grep -E "^v${SEMVER}$" |
              head -n1 || true
          )
          if [ -z "$LATEST" ]; then
            NEXT_TAG="v0.1.0"
          else
            VERSION="${LATEST#v}"
            MAJOR=$(printf '%s' "$VERSION" | cut -d. -f1)
            MINOR=$(printf '%s' "$VERSION" | cut -d. -f2)
            NEXT_TAG="v${MAJOR}.$((MINOR + 1)).0"
          fi
          echo "version=${NEXT_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "tag=$NEXT_TAG" >> "$GITHUB_OUTPUT"
          echo "create_tag=true" >> "$GITHUB_OUTPUT"
          echo "Releasing: ${LATEST:-none} → $NEXT_TAG"

      - name: Create and push tag
        if: steps.version.outputs.create_tag == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Auto-release $TAG"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            push "https://github.com/$GITHUB_REPOSITORY.git" "$TAG"

  release:
    name: Compile and publish
    needs: tag
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
      id-token: write
    with:
      version: ${{ needs.tag.outputs.version }}
      checkout_ref: ${{ needs.tag.outputs.checkout_ref }}
