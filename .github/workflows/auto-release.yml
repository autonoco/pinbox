name: auto-release

# On pushes to main, tags the next minor version and publishes in ONE job.
# Same shape as autonoco/buttons: tag the merge SHA, then compile, GitHub Release, npm.
# Rapid pushes are serialized by the shared `pinbox-release` concurrency group; the newest
# queued main commit is released after the active release finishes.
#
# Previous approach (separate auto-release → release.yml via workflow_call) is the split
# buttons already abandoned. A reusable call is still two jobs; GITHUB_TOKEN tag pushes
# still do not trigger sibling workflows. Tag + publish stay in this job.
#
# The git tag is the version. Manifests are stamped in this workspace only — never
# committed back to main. Do not bump package.json or open a version PR.
#
# To skip a release: include [skip release] in the merge commit.
# Bot commits (docs-sync) are skipped automatically.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semver tag to recover (for example, v0.2.0)
        required: true
        type: string

# Share the same lock as release.yml so a hand-pushed tag cannot race this job.
concurrency:
  group: pinbox-release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Tag and release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.actor != 'github-actions[bot]' &&
        !contains(github.event.head_commit.message, '[skip release]')
      )
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Manual recovery must build the existing tag, not the branch used
          # to dispatch the workflow. Push-triggered releases use their SHA.
          ref: ${{ inputs.tag || github.sha }}
          persist-credentials: false

      - name: Determine next version
        id: version
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # One canonical SemVer policy (semver.org grammar) — byte-for-byte the SEMVER_SOURCE
          # the tools/release version stamper enforces; workflows.test.ts asserts they match.
          SEMVER='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?'
          if [ -n "$REQUESTED_TAG" ]; then
            if ! printf '%s' "$REQUESTED_TAG" | grep -Eq "^v${SEMVER}$"; then
              echo "Invalid recovery tag: $REQUESTED_TAG" >&2
              exit 1
            fi

            TAG_SHA=$(git rev-parse --verify "refs/tags/$REQUESTED_TAG^{commit}")
            HEAD_SHA=$(git rev-parse HEAD)
            if [ "$TAG_SHA" != "$HEAD_SHA" ]; then
              echo "Recovery checkout mismatch: $REQUESTED_TAG points to $TAG_SHA, checked out $HEAD_SHA" >&2
              exit 1
            fi

            echo "version=${REQUESTED_TAG#v}" >> "$GITHUB_OUTPUT"
            echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
            echo "create_tag=false" >> "$GITHUB_OUTPUT"
            echo "Recovering existing release: $REQUESTED_TAG"
            exit 0
          fi

          # Rerun guard: if a previous attempt already tagged this SHA (tag pushed, later
          # step failed), reuse that tag instead of computing the next minor from it.
          EXISTING_TAG=$(
            git tag --points-at HEAD --list 'v*' --sort=-version:refname |
              grep -E "^v${SEMVER}$" |
              head -n1 || true
          )
          if [ -n "$EXISTING_TAG" ]; then
            echo "version=${EXISTING_TAG#v}" >> "$GITHUB_OUTPUT"
            echo "tag=$EXISTING_TAG" >> "$GITHUB_OUTPUT"
            echo "create_tag=false" >> "$GITHUB_OUTPUT"
            echo "Reusing existing release tag: $EXISTING_TAG"
            exit 0
          fi

          LATEST=$(
            git tag --list 'v*' --sort=-version:refname |
              grep -E "^v${SEMVER}$" |
              head -n1 || true
          )
          if [ -z "$LATEST" ]; then
            NEXT_TAG="v0.1.0"
          else
            VERSION="${LATEST#v}"
            MAJOR=$(printf '%s' "$VERSION" | cut -d. -f1)
            MINOR=$(printf '%s' "$VERSION" | cut -d. -f2)
            NEXT_TAG="v${MAJOR}.$((MINOR + 1)).0"
          fi
          echo "version=${NEXT_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "tag=$NEXT_TAG" >> "$GITHUB_OUTPUT"
          echo "create_tag=true" >> "$GITHUB_OUTPUT"
          echo "Releasing: ${LATEST:-none} → $NEXT_TAG"

      - name: Create and push tag
        if: steps.version.outputs.create_tag == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Auto-release $TAG"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            push "https://github.com/$GITHUB_REPOSITORY.git" "$TAG"

      # Caching is disabled on both setup steps: this job holds contents: write and
      # id-token: write and publishes to npm, so a poisoned cache entry could reach
      # a GitHub Release or the registry.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          no-cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - run: bun install --frozen-lockfile

      - name: stamp the tag version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$VERSION" || (echo "no version from tag step" >&2 && exit 1)
          bun tools/release/bump-version.ts "$VERSION"

      - name: compile every target at the version being released
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$VERSION" || (echo "no version from tag step" >&2 && exit 1)
          bun run release:build "$VERSION"

      - name: checksums
        run: |
          cd dist/release/bin
          for asset in pinbox-*; do sha256sum "$asset" > "$asset.sha256"; done

      - name: publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          assets=(dist/release/bin/pinbox-* tools/release/install.sh)
          # A failed earlier attempt can leave the release created with missing or
          # partial assets; the rerun must repair them, not skip the upload.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists: refreshing assets"
            gh release upload "$TAG" "${assets[@]}" --clobber
            exit 0
          fi
          target="$(git rev-parse HEAD)"
          gh release create "$TAG" \
            --target "$target" \
            --title "$TAG" \
            --generate-notes \
            "${assets[@]}"

      - run: bun run build

      - name: check every package can be published from CI
        run: bun tools/release/preflight.ts

      - name: publish the version being released
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN NPM_CONFIG_USERCONFIG
          bun run release:publish "$VERSION"
