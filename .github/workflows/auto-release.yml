name: auto-release

# On pushes to main, bumps the next minor version, tags it, and runs the release pipeline in
# ONE workflow (via workflow_call into release.yml). Rapid pushes are serialized by the shared
# `release` concurrency group; the newest queued main commit is released after the active
# release finishes.
#
# Pinbox cannot tag alone the way a Go binary can: `pinbox --version` and release:build/publish
# read packages/cli/package.json, so this workflow bumps every shipped package, commits that
# bump with [skip release], then tags the bump commit and hands the tag to release.yml.
#
# Previous approach (tag-only → hope release.yml fires) breaks because GitHub blocks
# cross-workflow triggering from GITHUB_TOKEN:
#   "Events triggered by GITHUB_TOKEN will not create a new workflow run."
#
# To skip a release: include [skip release] in the merge commit.
# Bot commits (docs-sync, the version bump itself) are skipped automatically.
#
# Gitleaks runs here before any bump or publish — same scanner as secret-scan.yml, on the
# commits this push introduced.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semver tag to recover (for example, v0.2.0)
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

# Job-scoped below: only `prepare` pushes, and only the reusable release call needs the
# release/OIDC grants release.yml's jobs declare for themselves.
permissions:
  contents: read

jobs:
  decide:
    name: Decide version
    timeout-minutes: 5
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.actor != 'github-actions[bot]' &&
        !contains(github.event.head_commit.message, '[skip release]')
      )
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      create_tag: ${{ steps.version.outputs.create_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Manual recovery must build the existing tag, not the branch used to dispatch.
          ref: ${{ inputs.tag || github.sha }}
          persist-credentials: false

      - name: Determine next version
        id: version
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED_TAG" ]; then
            if ! printf '%s' "$REQUESTED_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
              echo "Invalid recovery tag: $REQUESTED_TAG" >&2
              exit 1
            fi

            TAG_SHA=$(git rev-parse --verify "refs/tags/$REQUESTED_TAG^{commit}")
            HEAD_SHA=$(git rev-parse HEAD)
            if [ "$TAG_SHA" != "$HEAD_SHA" ]; then
              echo "Recovery checkout mismatch: $REQUESTED_TAG points to $TAG_SHA, checked out $HEAD_SHA" >&2
              exit 1
            fi

            version="${REQUESTED_TAG#v}"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
            echo "create_tag=false" >> "$GITHUB_OUTPUT"
            echo "Recovering existing release: $REQUESTED_TAG"
            exit 0
          fi

          # Only real release tags feed the arithmetic below — a stray `v*` tag that is not
          # vMAJOR.MINOR.PATCH would otherwise wedge every future auto-release.
          LATEST=$(
            git tag --list 'v*' --sort=-version:refname |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' |
              head -n1 || true
          )
          if [ -z "$LATEST" ]; then
            NEXT_TAG="v0.1.0"
          else
            VERSION="${LATEST#v}"
            MAJOR=$(printf '%s' "$VERSION" | cut -d. -f1)
            MINOR=$(printf '%s' "$VERSION" | cut -d. -f2)
            NEXT_TAG="v${MAJOR}.$((MINOR + 1)).0"
          fi
          version="${NEXT_TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$NEXT_TAG" >> "$GITHUB_OUTPUT"
          echo "create_tag=true" >> "$GITHUB_OUTPUT"
          echo "Releasing: ${LATEST:-none} → $NEXT_TAG"

  secret-scan:
    name: gitleaks
    timeout-minutes: 10
    needs: decide
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Scan introduced commits
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # workflow_dispatch has no push range, and its github.sha is the branch the run was
          # dispatched from — not the tag being recovered. Scan the tag's own commit instead.
          if [ -n "$REQUESTED_TAG" ]; then
            HEAD_SHA=$(git rev-parse --verify "refs/tags/$REQUESTED_TAG^{commit}")
            BASE_SHA=""
          fi
          bun tools/security/scan-introduced-secrets.ts

  prepare:
    name: Bump and tag
    timeout-minutes: 10
    needs: [decide, secret-scan]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # The only job here that writes: it pushes the bump commit and the tag.
    permissions:
      contents: write
    outputs:
      version: ${{ needs.decide.outputs.version }}
      tag: ${{ needs.decide.outputs.tag }}
      checkout_ref: ${{ steps.tag.outputs.checkout_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.sha }}
          # Push uses an explicit Authorization header below — never leave the token in .git/config.
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Bump package versions
        if: needs.decide.outputs.create_tag == 'true'
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          set -euo pipefail
          # Always tip of main — a queued run must not push a bump based on a stale SHA once a
          # later merge (or an earlier bump) has moved the branch.
          git fetch origin main
          git checkout -B auto-release origin/main
          bun tools/release/bump-version.ts "$VERSION"

      - name: Commit version bump
        if: needs.decide.outputs.create_tag == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.decide.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/cli/package.json packages/core/package.json \
            packages/toolbar/package.json packages/mcp/package.json
          git commit -m "chore(release): ${TAG} [skip release]"
          # Authenticated for this one process and nothing else (same pattern as docs-sync.yml).
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            push "https://github.com/$GITHUB_REPOSITORY.git" "HEAD:main"

      - name: Create and push tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.decide.outputs.tag }}
          CREATE_TAG: ${{ needs.decide.outputs.create_tag }}
        run: |
          set -euo pipefail
          if [ "$CREATE_TAG" = "true" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Auto-release $TAG"
            git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
              push "https://github.com/$GITHUB_REPOSITORY.git" "$TAG"
          fi
          echo "checkout_ref=$TAG" >> "$GITHUB_OUTPUT"

  release:
    name: Compile and publish
    needs: prepare
    uses: ./.github/workflows/release.yml
    # The caller must grant at least what the callee's jobs use: contents for the GitHub
    # Release, id-token for npm Trusted Publishing. release.yml runs on github.token and
    # job-scoped OIDC only, so no secrets are passed.
    permissions:
      contents: write
      id-token: write
    with:
      version: ${{ needs.prepare.outputs.version }}
      checkout_ref: ${{ needs.prepare.outputs.checkout_ref }}
