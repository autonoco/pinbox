# The plugin artifacts are GENERATED from the CLI command tree — never hand-edited. tools/skillgen
# writes six of them: three byte-identical SKILL.md copies (skills/pinbox, plugins/pinbox, the
# hermes integration), both plugin manifests, and the embedded packages/cli/src/init/plugin-assets.ts.
# This workflow is what keeps that true: on any main push touching the CLI it re-runs the generator
# in `--check` mode — the one gate that covers the whole set — and on drift opens a PR carrying the
# full regeneration. A PR rather than a push to main, so the skill's wording is still read by a
# human before it ships to agents.
name: docs-sync

on:
  push:
    branches: [main]
    paths:
      - "packages/cli/src/**"
      - "tools/skillgen/**"
  workflow_dispatch:

concurrency:
  group: docs-sync
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  docs-sync:
    timeout-minutes: 20
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      # The core build below runs tsdown, which needs Node >= 23.6 to load its TS config
      # natively; pin 24 rather than trust the image's Node.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      # skillgen imports the CLI's command tree, which imports @autono/pinbox-core subpaths —
      # those resolve to dist/, so core must be built or the generator dies on module resolution.
      - run: bun run --filter '@autono/pinbox-core' build
      - name: detect drift
        id: drift
        # `--check` byte-diffs every generated artifact and exits 1 on any of them, printing the
        # drifted paths. Exit 0 is clean; anything else is the generator itself failing, and the
        # regeneration below re-runs it without --check, so a crash cannot be mistaken for drift.
        run: |
          status=0
          bun tools/skillgen/generate.ts --check || status=$?
          if [ "$status" -eq 0 ]; then
            echo "drifted=false" >> "$GITHUB_OUTPUT"
          else
            echo "drifted=true" >> "$GITHUB_OUTPUT"
          fi
      - name: open the regeneration PR
        if: steps.drift.outputs.drifted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: docs-sync/skillgen-${{ github.run_id }}
        # `git add -A` because the generated set is six files across four directories: staging one
        # of them lands a partial regeneration that leaves the repo drifted after the merge that
        # was meant to fix it.
        run: |
          bun tools/skillgen/generate.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git --no-pager diff --cached --stat
          git commit -m "docs(skill): regenerate plugin artifacts from the CLI command tree"
          # Authenticated for this one process and nothing else. `git remote set-url` with the
          # token in it would write the credential into .git/config in plaintext, where it stays
          # for every step that follows — the exact on-disk state persist-credentials:false removes.
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            push "https://github.com/$GITHUB_REPOSITORY.git" "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "docs(skill): regenerate plugin artifacts from the CLI command tree" \
            --body "The CLI command tree changed; \`tools/skillgen/generate.ts\` produced \
          different output. Generated files — review the wording, then merge. Never hand-edit \
          them; edit the command tree or the generator instead."
