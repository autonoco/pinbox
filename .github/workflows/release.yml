name: release

# Hand-pushed v* tags only. Auto-release never calls this.
#
# A tag pushed with GITHUB_TOKEN does not trigger sibling workflows, which is why
# autonoco/buttons (and pinbox auto-release) publish in the same job that creates
# the tag. This file is the leftover path for an externally pushed tag — same as
# buttons' release.yml, which runs goreleaser and does not publish npm.

on:
  push:
    tags: ["v*"]

# Share the same lock as auto-release.yml so a hand-pushed tag cannot race a
# main-branch or manual recovery release.
concurrency:
  group: pinbox-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Caching is disabled on both setup steps: this job holds contents: write and
      # publishes artifacts, so a poisoned cache entry could reach a GitHub Release.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          no-cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - run: bun install --frozen-lockfile

      - name: stamp the tag version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          SEMVER='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?'
          if ! printf '%s' "$REF_NAME" | grep -Eq "^v${SEMVER}$"; then
            echo "tag $REF_NAME is not a v<semver> release tag" >&2
            exit 1
          fi
          VERSION="${REF_NAME#v}"
          bun tools/release/bump-version.ts "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
        id: version

      - name: compile every target at the version being released
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$VERSION" || (echo "no version from tag" >&2 && exit 1)
          bun run release:build "$VERSION"

      - name: checksums
        run: |
          cd dist/release/bin
          for asset in pinbox-*; do sha256sum "$asset" > "$asset.sha256"; done

      - name: publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          target="$(git rev-parse HEAD)"
          gh release create "$TAG" \
            --target "$target" \
            --title "$TAG" \
            --generate-notes \
            dist/release/bin/pinbox-* \
            tools/release/install.sh
