# Tag → compile → smoke → GitHub Release → npm, in ONE workflow.
#
# One workflow because a tag pushed with GITHUB_TOKEN does not trigger sibling workflows: a
# split "tag" / "publish" pair would silently never fire. Everything here is credential wiring
# and job ordering; the logic lives in tools/release/*.
#
# Gate order is the point: nothing is published until the pack-and-install e2e has installed
# the very binaries this run compiled, on both OSes, with bun off PATH.
name: release

on:
  push:
    tags: ["v*"]
    # Merging a version bump releases it. Publishing only ever ran from a hand-cut tag, and exactly
    # one tag was ever cut — so "CI publishes the package" was never true. `plan` below decides
    # whether a main push is a release by comparing the manifest version against the tags that
    # already exist, so an ordinary merge does nothing and a version bump ships.
    branches: [main]
  # Dispatch is kept for re-running a release whose npm step failed after the tag was cut, but it
  # is only ever legal from a *tag* ref (GitHub's "Run workflow" ref picker lists tags). Started
  # from a branch, `github.ref_name` is the branch — an unguarded dispatch from `main` would cut a
  # Release named `main` and fan it out to npm, and npm unpublish is heavily restricted. Hence the
  # `guard` job below, which every other job waits on. Dispatching from a tag also means the
  # checkout is the tagged tree, which an input-supplied tag could never guarantee.
  workflow_dispatch:

# Never cancel a release in flight — a half-published channel is worse than a slow one.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The one gate every other job hangs off, and the only place that decides what is being released.
  # Cheap, first, and loud: a ref it cannot make sense of fails the run rather than skipping it, so
  # a mis-aimed dispatch is visible instead of looking green.
  plan:
    timeout-minutes: 5
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      release: ${{ steps.decide.outputs.release }}
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags are the record of what has already shipped; without them every merge looks new.
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      # Refs arrive through env, never interpolated into the shell: a ref name is attacker-shaped
      # input the moment anyone can push a tag.
      - id: decide
        name: work out whether this run releases, and what
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = "tag" ]; then
            # A tag says its own version. Being a tag is not enough — everything downstream strips
            # the leading `v` and treats the rest as the version it compiles and publishes.
            if ! printf '%s' "$REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
              echo "tag $REF_NAME is not a v<semver> release tag" >&2
              exit 1
            fi
            version="${REF_NAME#v}"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            # A branch says nothing; the manifest does. `pinbox --version` reads this file, so it
            # is the only honest source for what a merge would ship.
            version="$(bun -e 'console.log((await Bun.file("packages/cli/package.json").json()).version)')"
            if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
              echo "v$version is already tagged — nothing to release" >&2
              echo "release=false" >> "$GITHUB_OUTPUT"
            else
              echo "release=true" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "version $version"

  validate:
    timeout-minutes: 20
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      # tsdown's bin runs under system Node and loads tsdown.config.ts with native type
      # stripping, which needs Node >= 23.6; pin 24 rather than trust the image's Node.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run ci:validate

  compile:
    timeout-minutes: 30
    needs: [plan, validate]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      # release:build rebuilds the libraries with tsdown, which needs Node >= 23.6 (see validate).
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      # `bun build --compile` cross-compiles: one Linux job emits all four binaries.
      #
      # The tag is passed in, and that is the whole point: `pinbox --version` reads
      # packages/cli/package.json, so compileAll asserts that manifest against the tag being
      # released. Called with no argument it compares the manifest to itself and can never fail —
      # tagging v1.2.3 over an unmerged changesets version PR would then ship 1.2.2 binaries under
      # a Release named v1.2.3. The ref arrives through env, never interpolated into the shell: a
      # ref name is attacker-shaped input the moment anyone can push a tag.
      - name: compile every target at the version being released
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$VERSION" || (echo "no version from plan" >&2 && exit 1)
          bun run release:build "$VERSION"
      - name: checksums
        run: |
          cd dist/release/bin
          for asset in pinbox-*; do sha256sum "$asset" > "$asset.sha256"; done
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/release/bin
          if-no-files-found: error

  smoke:
    timeout-minutes: 20
    needs: [plan, compile]
    strategy:
      fail-fast: true
      matrix:
        os: [blacksmith-4vcpu-ubuntu-2404, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      # node + npm are what the launcher shim and the install test actually run on.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist/release/bin
      - name: dogfood the artifact this run compiled
        run: |
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64) asset=pinbox-linux-x64 ;;
            Linux-ARM64) asset=pinbox-linux-arm64 ;;
            macOS-X64) asset=pinbox-darwin-x64 ;;
            macOS-ARM64) asset=pinbox-darwin-arm64 ;;
            *) echo "unmapped runner ${{ runner.os }}-${{ runner.arch }}" >&2; exit 1 ;;
          esac
          chmod +x "dist/release/bin/$asset"
          PINBOX_RELEASE_BINARY="$PWD/dist/release/bin/$asset" bun test tools/release/release.test.ts

  github-release:
    timeout-minutes: 15
    needs: [plan, smoke]
    # Belt and braces over `plan`: the two irreversible jobs re-check for themselves, so neither a
    # single-job re-run nor a future edit to `needs` can ship something nobody decided to ship.
    if: needs.plan.outputs.release == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist/release/bin
      - name: publish the GitHub Release
        # Values arrive through env, never interpolated into the shell: a ref name is
        # attacker-shaped input the moment anyone can push a tag.
        #
        # `--target` pins the Release to this exact commit, so releasing from a merge tags the
        # tree that was tested rather than whatever main has moved on to.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --target "$SHA" \
            --title "$TAG" \
            --generate-notes \
            dist/release/bin/pinbox-* \
            tools/release/install.sh

  publish:
    timeout-minutes: 20
    needs: [plan, github-release]
    # See github-release: npm publishes cannot be taken back, so this check is duplicated rather
    # than delegated.
    if: needs.plan.outputs.release == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Trusted Publishing: npm mints its credential from this OIDC token, and --provenance
    # binds every tarball to this repo, workflow, and commit. No npm token is stored.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # npm is CI publishing glue for the one flag `bun publish` lacks (--provenance).
      # Deliberately NOT `npm install -g npm@latest`: npm's in-place self-upgrade swaps its own
      # dependencies out mid-install and corrupts its module graph (MODULE_NOT_FOUND on
      # promise-retry). Node 24 already ships npm >= 11.5.1, which is what Trusted Publishing
      # requires, so the upgrade bought nothing and could only break the publish.
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist/release/bin
      - run: chmod +x dist/release/bin/pinbox-*
      # Order is the contract: core → toolbar → mcp → platform packages → launcher LAST.
      # The tag is passed here too, so the same manifest-vs-tag assertion guards the artifacts
      # that actually reach the registry, not only the ones this run compiled.
      # Names the real blocker before anything is uploaded. Trusted Publishing cannot CREATE a
      # scoped package — npm answers a bare 404 on the PUT, which reads like the package is
      # missing rather than like a setting is. That exact 404 is why the last release failed.
      - name: check every package can be published from CI
        run: bun tools/release/preflight.ts
      - name: publish the version being released
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: bun run release:publish "$VERSION"
