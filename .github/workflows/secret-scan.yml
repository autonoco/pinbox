# Required check on main. Logic lives in tools/security/, not here (tools/README.md house rule) —
# this file only picks the commit range out of the event and hands it over.
name: secret-scan
on:
  push:
    branches: [main]
  pull_request:
  # Same reason as validate.yml: a dropped push event otherwise leaves commits on main unscanned.
  workflow_dispatch:

# Read-only. The scan needs nothing but the objects, and a leaked token is the failure mode it
# exists to prevent.
permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 is load-bearing. The scan is a range over history, and the default shallow
      # clone has no history to range over — the job passes having scanned nothing.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - name: Scan introduced commits
        # Through env, never `${{ }}` inside the shell: on a fork PR the head SHA is attacker-set.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bun tools/security/scan-introduced-secrets.ts
