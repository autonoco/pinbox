# Runs the single root validation script verbatim (logic lives in package.json/tools, not YAML).
name: validate
on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger: a platform outage can drop push events entirely, leaving commits on main
  # with no run at all. This is how you re-check a green tree without an empty commit.
  workflow_dispatch:
jobs:
  validate:
    timeout-minutes: 20
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      # tsdown's bin runs under system Node and loads tsdown.config.ts with native type
      # stripping, which needs Node >= 23.6; pin 24 rather than trust the image's Node.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run ci:validate
