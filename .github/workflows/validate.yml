# Runs the single root validation script verbatim (logic lives in package.json/tools, not YAML).
name: validate
on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger: a platform outage can drop push events entirely, leaving commits on main
  # with no run at all. This is how you re-check a green tree without an empty commit.
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run ci:validate
